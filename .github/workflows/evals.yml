name: Evals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  plugin-eval:
    name: claude plugin eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.311
          claude --version

      - name: Run plugin evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . --trust-plugin --json results.json --threshold 0.8 \
            --model claude-sonnet-5-5 --judge-model claude-haiku-5-5 \
            --ablation none --max-cost-usd 10 --no-publish

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            results.json
            evals/results/
          if-no-files-found: ignore
