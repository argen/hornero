name: Evals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  plugin-eval:
    name: claude plugin eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.311
          claude --version

      - name: Run plugin evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . --trust-plugin --scaffold --json results.json --threshold 0 \
            --model claude-sonnet-5-5 --judge-model claude-haiku-5-5 \
            --ablation none --max-cost-usd 10 --no-publish

      # --threshold is per case, and one sample per routing case makes that gate
      # flaky, so gate on the overall score and only report low cases.
      - name: Gate on overall score
        env:
          GATE: "0.85"
        run: |
          jq -r --argjson gate "$GATE" '
            "Overall score: \(.aggregates.overallScore * 1000 | round / 1000) (gate \($gate)), \(.aggregates.casesPassed)/\(.aggregates.casesTotal) cases passed",
            "",
            "Cases below 0.8:",
            (.cases[] | select(.aggregates.score < 0.8) | "- \(.name): \(.aggregates.score * 100 | round / 100)")
          ' results.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e --argjson gate "$GATE" '(.partial | not) and .aggregates.overallScore >= $gate' results.json > /dev/null

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            results.json
            evals/results/
          if-no-files-found: ignore
